        function buildSectionPills() {
            const container = document.getElementById('sectionPills');
            const seen = new Set();
            let out = '';
            slides.forEach((s, i) => {
                if (!seen.has(s.secIdx)) {
                    seen.add(s.secIdx);
                    const active = slides[idx].secIdx === s.secIdx;
                    out += `<button onclick="jump(${i})" class="px-2.5 py-1 rounded-lg text-[11px] font-extrabold transition ${active ? 'bg-amber-500 text-slate-950' : 'text-slate-500 dark:text-slate-400 hover:text-amber-400'}">ق${s.secIdx}</button>`;
                }
            });
            container.innerHTML = out;
        }

        // بناء الفهرس الجانبي
        function buildTOC() {
            const list = document.getElementById('tocList');
            const groups = new Map();

            slides.forEach((s, i) => {
                const okType = filterType === 'all' || s.type === filterType;
                const okQuery = !query || s.title.includes(query) || s.section.includes(query) || s.num.includes(query);
                if (okType && okQuery) {
                    if (!groups.has(s.section)) groups.set(s.section, []);
                    groups.get(s.section).push({ ...s, i });
                }
            });

            if (groups.size === 0) {
                list.innerHTML = `<div class="text-center text-xs text-slate-400 py-8">لا توجد نتائج مطابقة</div>`;
                return;
            }

            let html = '';
            groups.forEach((items, secName) => {
                html += `
                    <div class="space-y-1">
                        <div class="px-2.5 py-1.5 rounded-lg bg-slate-200/70 dark:bg-white/5 text-[11px] font-extrabold text-amber-600 dark:text-amber-400">
                            ${secName}
                        </div>
                        <div class="space-y-1 pr-1">
                            ${items.map(s => {
                                const active = s.i === idx;
                                return `
                                    <button onclick="jump(${s.i})" class="w-full text-right p-2.5 rounded-xl transition flex flex-col gap-1 ${active ? 'bg-amber-500 text-slate-950 font-black shadow' : 'hover:bg-slate-200/50 dark:hover:bg-white/5 text-slate-700 dark:text-slate-300'}">
                                        <div class="flex items-center justify-between text-[10px]">
                                            <span class="opacity-75">شريحة ${s.num}</span>
                                            <span class="px-1.5 py-0.5 rounded ${active ? 'bg-slate-950/15' : 'bg-white/10'}">${typeMeta[s.type].label}</span>
                                        </div>
                                        <span class="text-xs font-bold leading-snug line-clamp-2">${s.title}</span>
                                    </button>
                                `;
                            }).join('')}
                        </div>
                    </div>
                `;
            });
            list.innerHTML = html;
        }

        // عرض الشريحة الحالية
        function render() {
            const s = slides[idx];
            document.getElementById('slideContainer').innerHTML = `<div class="slide-stage-anim">${s.html()}</div>`;
            document.getElementById('slideIdxLabel').textContent = idx + 1;
            document.getElementById('slideTotalLabel').textContent = slides.length;
            document.getElementById('badgeSec').textContent = s.section;

            const bt = document.getElementById('badgeType');
            bt.textContent = typeMeta[s.type].label;
            bt.className = `hidden sm:inline-block text-xs font-bold px-3 py-1 rounded-full ${typeMeta[s.type].cls}`;

            document.getElementById('topProgress').style.width = `${((idx + 1) / slides.length) * 100}%`;
            document.getElementById('prevBtn').disabled = idx === 0;
            document.getElementById('nextBtn').disabled = idx === slides.length - 1;

            document.getElementById('noteBody').textContent = s.note;
            document.getElementById('noteTime').textContent = `المدة: ${s.time}`;
            document.getElementById('stageScroller').scrollTop = 0;

            buildSectionPills();
            buildTOC();
        }

        function jump(target) {
            if (target >= 0 && target < slides.length) {
                idx = target;
                render();
                if (window.innerWidth < 1024) {
                    document.getElementById('leftSidebar').classList.add('hidden');
                }
            }
        }

        function setTypeFilter(t) {
            filterType = t;
            document.querySelectorAll('.t-filter').forEach(b => {
                b.className = b.dataset.f === t
                    ? 't-filter py-1.5 rounded-lg bg-amber-500 text-slate-950 font-extrabold'
                    : 't-filter py-1.5 rounded-lg bg-slate-200/70 dark:bg-white/5 text-slate-600 dark:text-slate-300';
            });
            buildTOC();
        }

        // تفاعلات الشرائح الداخلية
        function toggleBridgeItem(i) {
            const el = document.getElementById(`bridge-ans-${i}`);
            if (el) el.classList.toggle('opacity-15');
        }
        function toggleAllBridge() {
            bridgeOpen = !bridgeOpen;
            for (let i = 0; i < 5; i++) {
                const el = document.getElementById(`bridge-ans-${i}`);
                if (el) bridgeOpen ? el.classList.remove('opacity-15') : el.classList.add('opacity-15');
            }
        }

        const bmcItems = [
            { t: 'شرائح العملاء', q: 'من نخدم؟', ex: 'المتاجر الإلكترونية والشركات التي تبيع عبر منصات التواصل الاجتماعي.', ic: 'fa-users' },
            { t: 'القيمة المقدمة', q: 'ما المشكلة التي نحلها؟', ex: 'منع ضياع المحادثات وربط المبيعات بالمخزون لزيادة الأرباح.', ic: 'fa-gift' },
            { t: 'القنوات', q: 'كيف نصل إلى العملاء؟', ex: 'الإعلانات الممولة، التسويق بالمحتوى، والندوات الأكاديمية.', ic: 'fa-bullhorn' },
            { t: 'العلاقة مع العملاء', q: 'كيف نكتسب العميل ونحافظ عليه؟', ex: 'دعم فني مباشر، تدريب مستمر، ومتابعة دورية.', ic: 'fa-headset' },
            { t: 'مصادر الإيرادات', q: 'مقابل ماذا يدفع العميل؟', ex: 'اشتراكات شهرية/سنوية وباقات تدريب وتطوير.', ic: 'fa-coins' },
            { t: 'الموارد الرئيسية', q: 'ماذا نحتاج لتشغيل النشاط؟', ex: 'المنصة التقنية، فريق التطوير، والمدربون.', ic: 'fa-server' },
            { t: 'الأنشطة الرئيسية', q: 'ما الأعمال التي يجب تنفيذها؟', ex: 'التطوير التقني، التسويق، والتأهيل البيعي.', ic: 'fa-list-check' },
            { t: 'الشركاء الرئيسيون', q: 'من يساعدنا على تقديم القيمة؟', ex: 'شركات الشحن، بوابات الدفع، والجامعات.', ic: 'fa-handshake' },
            { t: 'هيكل التكاليف', q: 'ما الموارد والأنشطة التي تكلفنا؟', ex: 'السيرفرات، الرواتب، وميزانية الإعلانات.', ic: 'fa-file-invoice-dollar' }
        ];
        function pickBmc(i) {
            const b = bmcItems[i];
            document.querySelectorAll('.bmc-tile').forEach((el, k) => {
                el.className = k === i
                    ? 'bmc-tile text-right p-4 rounded-2xl border transition-all bg-amber-500 text-slate-950 border-amber-400 font-black shadow-lg'
                    : 'bmc-tile text-right p-4 rounded-2xl border transition-all bg-slate-100/80 dark:bg-white/5 text-slate-800 dark:text-white border-slate-200 dark:border-white/10 hover:border-amber-400';
            });
            document.getElementById('bmcTitle').textContent = b.t;
            document.getElementById('bmcQ').textContent = b.q;
            document.getElementById('bmcEx').textContent = b.ex;
            document.getElementById('bmcIcon').className = `fa-solid ${b.ic}`;
        }

        function setS28View(v) {
            const m = document.getElementById('view28-main');
            const c = document.getElementById('view28-comp');
            const bm = document.getElementById('btn28-main');
            const bc = document.getElementById('btn28-comp');
            if (v === 'main') {
                m.classList.remove('hidden'); c.classList.add('hidden');
                bm.className = 'px-4 py-2 rounded-lg text-xs font-extrabold bg-amber-500 text-slate-950';
                bc.className = 'px-4 py-2 rounded-lg text-xs font-extrabold text-slate-600 dark:text-slate-300';
            } else {
                m.classList.add('hidden'); c.classList.remove('hidden');
                bc.className = 'px-4 py-2 rounded-lg text-xs font-extrabold bg-amber-500 text-slate-950';
                bm.className = 'px-4 py-2 rounded-lg text-xs font-extrabold text-slate-600 dark:text-slate-300';
            }
        }

        const ccItems = [
            { m: 'CRM', f: 'إدارة علاقات العملاء', d: 'توحيد ملف العميل وسجل طلباته وتفاعلاته لمنع ضياع الفرص.' },
            { m: 'Inbox', f: 'إدارة المحادثات والقنوات', d: 'جمع رسائل واتساب وإنستغرام في مكان واحد وتوزيعها على الفريق.' },
            { m: 'Campaigns', f: 'إدارة الحملات', d: 'إطلاق حملات تواصل مستهدفة وقياس عائدها البيعي بدقة.' },
            { m: 'AI', f: 'توظيف الذكاء الاصطناعي', d: 'مساعدة الموظفين في صياغة الردود وتحليل نية العميل.' },
            { m: 'Automation', f: 'أتمتة المحادثات والعمليات', d: 'ردود آلية ذكية وجدولة متابعات تلقائية للعملاء.' },
            { m: 'Integrations', f: 'ربط الأنظمة والخدمات', d: 'تكامل سلس مع المتاجر الإلكترونية وشركات التوصيل.' },
            { m: 'POS', f: 'إدارة البيع والفواتير والمخزون', d: 'إصدار الفواتير من داخل المحادثة وتحديث المخزون لحظياً.' }
        ];
        function pickCC(i) {
            const c = ccItems[i];
            document.querySelectorAll('.cc-tile').forEach((el, k) => {
                el.className = k === i
                    ? 'cc-tile p-4 rounded-2xl border text-right transition bg-emerald-500 text-slate-950 border-emerald-400 font-black shadow-lg'
                    : 'cc-tile p-4 rounded-2xl border text-right transition bg-slate-100/80 dark:bg-white/5 text-slate-800 dark:text-white border-slate-200 dark:border-white/10 hover:border-emerald-400';
            });
            document.getElementById('ccHead').textContent = `${c.m} - ${c.f}`;
            document.getElementById('ccDesc').textContent = c.d;
        }

        // مؤقت ورشة العمل
        function drawTimer() {
            const el = document.getElementById('timerTxt');
            if (!el) return;
            const m = Math.floor(timerSec / 60).toString().padStart(2, '0');
            const s = (timerSec % 60).toString().padStart(2, '0');
            el.textContent = `${m}:${s}`;
        }
        function toggleTimer() {
            const btn = document.getElementById('timerBtn');
            if (timerRef) {
                clearInterval(timerRef); timerRef = null;
                if (btn) btn.textContent = 'استئناف';
            } else {
                if (btn) btn.textContent = 'إيقاف';
                timerRef = setInterval(() => {
                    if (timerSec > 0) { timerSec--; drawTimer(); }
                    else { clearInterval(timerRef); timerRef = null; }
                }, 1000);
            }
        }
        function resetTimer() {
            clearInterval(timerRef); timerRef = null; timerSec = 600; drawTimer();
            const btn = document.getElementById('timerBtn');
            if (btn) btn.textContent = 'بدء';
        }

        function toggleNotesPanel() {
            document.getElementById('notesDrawer').classList.toggle('hidden');
        }
        function toggleCinemaMode() {
            document.body.classList.toggle('cinema-mode');
            document.getElementById('exitCinemaBtn').classList.toggle('hidden');
        }

        window.addEventListener('DOMContentLoaded', () => {
            render();
            document.getElementById('nextBtn').onclick = () => jump(idx + 1);
            document.getElementById('prevBtn').onclick = () => jump(idx - 1);
            document.getElementById('sidebarToggle').onclick = () => document.getElementById('leftSidebar').classList.toggle('hidden');
            document.getElementById('notesToggleBtn').onclick = toggleNotesPanel;
            document.getElementById('cinemaToggleBtn').onclick = toggleCinemaMode;

            document.getElementById('searchBox').oninput = (e) => {
                query = e.target.value.trim();
                buildTOC();
            };

            document.getElementById('themeBtn').onclick = () => {
                const html = document.documentElement;
                html.classList.toggle('dark');
                const isDark = html.classList.contains('dark');
                document.body.className = isDark
                    ? 'bg-royal-mesh text-slate-100 h-screen flex flex-col overflow-hidden transition-colors duration-300 select-none'
                    : 'light-mesh text-slate-900 h-screen flex flex-col overflow-hidden transition-colors duration-300 select-none';
                document.getElementById('themeIcon').className = isDark ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
            };

            document.addEventListener('keydown', (e) => {
                if (e.target.tagName === 'INPUT') return;
                if (e.key === 'ArrowLeft' || e.key === ' ') { e.preventDefault(); jump(idx + 1); }
                else if (e.key === 'ArrowRight') { e.preventDefault(); jump(idx - 1); }
                else if (e.key === 'Escape' && document.body.classList.contains('cinema-mode')) { toggleCinemaMode(); }
            });
        });
    </script>
</body>
</html>
